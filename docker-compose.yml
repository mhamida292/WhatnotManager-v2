services:
  warehouse:
    build: .
    image: whatnotmanager-v2
    # Distinct from the older `warehouse-manager` container, which stays running
    # alongside this one. Both the name and the host port below must not collide
    # with it.
    container_name: whatnotmanager-v2
    # Host 4342 -> container 3000. Change the left number to use a different
    # homelab port.
    ports:
      - "4342:3000"
    # Persist the data dir on the host: holds users.db (the account registry)
    # and ws/<userId>.db (the shared business workspace, ws/0.db). Gitignored.
    volumes:
      - ./data:/app/data
    environment:
      # Required, no default: a shared fallback secret would be public (it lives in
      # this repo), making session cookies forgeable. Compose refuses to start
      # without it. Set it in a .env file next to this one -- see .env.example.
      - APP_SECRET=${APP_SECRET:?set APP_SECRET in .env (see .env.example) -- generate one with `openssl rand -hex 32`}
      - DATA_DIR=/app/data
    restart: unless-stopped
