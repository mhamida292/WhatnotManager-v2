services:
  warehouse:
    build: .
    image: warehouse-manager
    container_name: warehouse-manager
    # Host 39390 -> container 3000. Change the left number to use a different
    # homelab port.
    ports:
      - "39390:3000"
    # Persist the data dir on the host: holds users.db (the account registry)
    # and ws/<userId>.db (the shared business workspace, ws/0.db). Gitignored.
    volumes:
      - ./data:/app/data
    environment:
      - APP_SECRET=${APP_SECRET:-change-me-to-a-long-random-string}
      - DATA_DIR=/app/data
    restart: unless-stopped
